name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-apple-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Generate man page
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: |
          ./target/${{ matrix.target }}/release/skillprism __generate_man > skillprism.1

      - name: Package binary
        shell: bash
        run: |
          BINARY_NAME="skillprism-${{ matrix.target }}"
          mkdir -p "$BINARY_NAME"
          cp "target/${{ matrix.target }}/release/skillprism" "$BINARY_NAME/"
          cp README.md LICENSE "$BINARY_NAME/"
          cp NOTICE skillprism.1 "$BINARY_NAME/" || true
          tar -cJf "$BINARY_NAME.tar.xz" "$BINARY_NAME"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: "*.tar.xz"

  create-release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute checksums
        shell: bash
        run: |
          printf '{\n' > artifacts/checksums.json
          first=true
          for f in artifacts/*/*.tar.xz; do
            [ -f "$f" ] || continue
            $first || printf ',\n' >> artifacts/checksums.json
            first=false
            basename=$(basename "$f")
            target="${basename#skillprism-}"
            target="${target%.tar.xz}"
            hash=$(sha256sum "$f" | cut -d' ' -f1)
            printf '  "%s": "sha256:%s"' "$target" "$hash" >> artifacts/checksums.json
          done
          printf '\n}\n' >> artifacts/checksums.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: >
            Automated release for ${{ github.ref_name }}.
            See the repository for the full changelog.
          files: |
            artifacts/**/*.tar.xz
            artifacts/checksums.json
          draft: false
          prerelease: false

  # npm Trusted Publishing: package settings must name this file (release.yml),
  # repository Tuvren/skillprism, and allow `npm publish`. No NPM_TOKEN.
  publish-npm:
    name: Publish npm package
    needs: create-release
    if: >-
      always() &&
      (needs.create-release.result == 'success' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Merge this release's checksums into the package
        working-directory: npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          gh release download "v${version}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern checksums.json \
            --dir "${RUNNER_TEMP}/rel" \
            --clobber
          VERSION="${version}" RELEASE_CHECKSUMS="${RUNNER_TEMP}/rel/checksums.json" \
            node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";

          const version = process.env.VERSION;
          const release = JSON.parse(readFileSync(process.env.RELEASE_CHECKSUMS, "utf8"));
          const manifest = JSON.parse(readFileSync("checksums.json", "utf8"));
          manifest[version] = Object.fromEntries(
            Object.entries(release).sort(([left], [right]) => left.localeCompare(right)),
          );
          const versions = Object.keys(manifest).sort((left, right) =>
            right.localeCompare(left, undefined, { numeric: true }),
          );
          const ordered = Object.fromEntries(versions.map((key) => [key, manifest[key]]));
          writeFileSync("checksums.json", `${JSON.stringify(ordered, null, 2)}\n`);
          EOF

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public --provenance
