schema_version: 1
acronym: SKP
archetype:
  primary: CLI/Tooling
  secondary: []
  confidence: high
  rationale: "skillprism is a single native executable. A skill author runs it from a shell to compile and install skills. vision.md names that target, and the repository ships a clap CLI with no server."
surfaces:
  - src/cli.rs
  - README.md
  - npm/**
  - site/content/**
  - .constitution/tech-spec/contracts/**
  - .constitution/tech-spec/data-models/**
diff_exclusions:
  - "**/Cargo.lock"
  - "**/*.snap"
default_branch: master
concurrency:
  worktree: ../skillprism-epic-<ID>
  branch: feat/epic-<id>-<slug>
  merge: squash
