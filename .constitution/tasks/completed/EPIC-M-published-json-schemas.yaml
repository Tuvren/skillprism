      text: "EPIC-M (github#32): contract tests for the JSON Schemas, absolute versioned $ids published at tuvren.github.io/skillprism/schema/v1/, and yaml-language-server modelines in scaffolds, examples and docs."
  candidate_terms: []
  routed_upstream:
