    - "Publish release-keyed schema snapshots (e.g. /schema/v0.3/) alongside the format-keyed /schema/v1/, so pinned binaries can validate against their own schema (issue #32 asked for release-keyed URLs)."
    - "The JetBrains link in site/content/docs/skill-yaml.md and siblings (and README.md) points at the general YAML help page; the JSON Schema mappings page (help/idea/json.html) is more specific."
