    - stage: tech-spec
      item: "Record the schema publication convention: schemas/ is the single source, published through Hugo module mounts in site/hugo.toml at /schema/v1/<name>.json keyed to the config format version; a format version 2 needs new mounts and $ids."
  follow_ups:
