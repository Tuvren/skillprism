boundaries:
  - id: BND-01
    legacy_id: CLI Entrypoint
    name: CLI Entrypoint
    kind: module
    type: CLI boundary
    responsibility: "Parse command-line arguments, validate flag combinations, and dispatch to build, validate, init, or a distribution command."
    inputs: ["Raw CLI arguments"]
    outputs: ["Structured dispatch to the build pipeline, the validate pipeline, the scaffolder, or the distribution CLI"]
    depends_on: []
    trust_boundary: true
    certainty: assumed
    assumption: "Migrated from the CLI Entrypoint table in containers.md. The module lives at src/cli.rs."
  - id: BND-02
    legacy_id: Project Loader
    name: Project Loader
    kind: module
    type: Library boundary
    responsibility: "Discover the skill tree, parse skillprism.yaml and skill.yaml, merge group-level variables, and find user harness overrides."
    inputs: ["Project root path"]
    outputs: ["Resolved project model: skills, variables, template paths, asset paths, and user harness definitions"]
    depends_on: []
    certainty: assumed
    assumption: "Migrated from the Project Loader table in containers.md. The module lives at src/loader."
  - id: BND-03
    legacy_id: Harness Registry
    name: Harness Registry
    kind: module
    type: Library boundary
    responsibility: "Hold the built-in harness definitions and apply user overrides or custom harnesses from the project loader."
    inputs: ["Harness name and optional user override definitions"]
    outputs: ["Resolved harness definition"]
    depends_on: [BND-02]
    certainty: assumed
    assumption: "Migrated from the Harness Registry table in containers.md. The module lives at src/registry."
  - id: BND-04
    legacy_id: Harness Resolver
    name: Harness Resolver
    kind: module
    type: Library boundary
    responsibility: "Pair each skill with its harness definition and check that the harness satisfies the skill's required capabilities."
    inputs: ["Project model and harness registry"]
    outputs: ["Resolved skill-harness pairs, or a collected list of resolve errors"]
    depends_on: [BND-02, BND-03]
    certainty: assumed
    assumption: "Migrated from the Harness Resolver table in containers.md. The module lives at src/resolver."
  - id: BND-05
    legacy_id: Validator
    name: Validator
    kind: module
    type: Library boundary
    responsibility: "Check MiniJinja syntax, undefined variables, and macro references for every resolved pair, and collect every error."
    inputs: ["Resolved skill-harness pairs"]
    outputs: ["Valid pairs plus a collected list of validation errors"]
    depends_on: [BND-04]
    certainty: assumed
    assumption: "Migrated from the Validator table in containers.md. The module lives at src/validator."
  - id: BND-06
    legacy_id: Template Engine
    name: Template Engine
    kind: module
    type: Library boundary
    responsibility: "Render skill content, sidecars, and manifest entries from a resolved pair and the harness macros."
    inputs: ["A resolved skill-harness pair"]
    outputs: ["Rendered skill content, sidecars, and a manifest entry, or an engine error"]
    depends_on: [BND-04]
    certainty: assumed
    assumption: "Migrated from the Template Engine table in containers.md. The module lives at src/engine."
  - id: BND-07
    legacy_id: Output Router
    name: Output Router
    kind: module
    type: Library boundary
    responsibility: "Resolve the target path for the chosen scope, copy assets, and write skill files, sidecars, and manifests atomically."
    inputs: ["A resolved pair, rendered output, target scope, and project root"]
    outputs: ["Written file paths, or a router error"]
    depends_on: [BND-04]
    certainty: assumed
    assumption: "Migrated from the Output Router table in containers.md. The module lives at src/router."
  - id: BND-08
    legacy_id: Scaffolder
    name: Scaffolder
    kind: module
    type: Library boundary
    responsibility: "Generate a new skillprism project or a single skill inside an existing project."
    inputs: ["Scaffold type, target path, and project name"]
    outputs: ["Created directory tree and files"]
    depends_on: []
    certainty: assumed
    assumption: "Migrated from the Scaffolder table in containers.md. The module lives at src/scaffold."
  - id: BND-09
    legacy_id: Distribution CLI
    name: Distribution CLI
    kind: module
    type: Library boundary
    responsibility: "Fetch, install, list, remove, and update skills, reusing the build pipeline and recording installs."
    inputs: ["Source string, scope and harness selection, and command flags"]
    outputs: ["Installed or removed skill files, state records, or a command error"]
    depends_on: [BND-02, BND-03, BND-04, BND-05, BND-06, BND-07, BND-10]
    trust_boundary: true
    certainty: assumed
    assumption: "Migrated from the Distribution CLI table in containers.md. The module lives at src/distribution."
  - id: BND-10
    legacy_id: State Layer
    name: State Layer
    kind: module
    type: Library boundary
    responsibility: "Track installed skills in a schema-versioned file under the user config directory, with atomic writes."
    inputs: ["Installed-skill records and scope or name queries"]
    outputs: ["Persisted installed.yaml, an in-memory record set, or a state error"]
    depends_on: []
    certainty: assumed
    assumption: "Migrated from the State Layer table in containers.md. The module lives at src/state."
edges:
  - from: BND-01
    to: BND-02
    protocol: in-process
    note: "Dispatches build and validate with the project root."
  - from: BND-01
    to: BND-08
    protocol: in-process
    note: "Dispatches init."
  - from: BND-01
    to: BND-09
    protocol: in-process
    note: "Dispatches add, list, remove, and update."
  - from: BND-02
    to: Filesystem
    protocol: file-handoff
    note: "Reads skillprism.yaml, skill.yaml, and harness overrides."
  - from: BND-03
    to: Filesystem
    protocol: file-handoff
    note: "Reads optional user harness overrides."
  - from: BND-04
    to: BND-02
    protocol: in-process
    note: "Pairs skills from the project model."
  - from: BND-04
    to: BND-03
    protocol: in-process
    note: "Resolves each harness name."
  - from: BND-05
    to: BND-04
    protocol: in-process
    note: "Validates resolved pairs."
  - from: BND-05
    to: Filesystem
    protocol: file-handoff
    note: "Reads templates to check syntax."
  - from: BND-06
    to: BND-05
    protocol: in-process
    note: "Renders pairs the validator accepted."
  - from: BND-06
    to: Filesystem
    protocol: file-handoff
    note: "Reads templates to render."
  - from: BND-07
    to: BND-06
    protocol: in-process
    note: "Routes rendered output."
  - from: BND-07
    to: Filesystem
    protocol: file-handoff
    note: "Writes skill files, sidecars, and manifests atomically."
  - from: BND-08
    to: Filesystem
    protocol: file-handoff
    note: "Creates scaffolded project files."
  - from: BND-09
    to: BND-02
    protocol: in-process
    note: "Reuses discovery and template helpers."
  - from: BND-09
    to: BND-03
    protocol: in-process
    note: "Resolves harnesses for an install."
  - from: BND-09
    to: BND-04
    protocol: in-process
    note: "Pairs a fetched skill with harness definitions."
  - from: BND-09
    to: BND-05
    protocol: in-process
    note: "Validates before writing. Fail closed."
  - from: BND-09
    to: BND-06
    protocol: in-process
    note: "Renders skillprism-format skills."
  - from: BND-09
    to: BND-07
    protocol: in-process
    note: "Writes rendered output."
  - from: BND-09
    to: BND-10
    protocol: in-process
    note: "Records and queries installs."
  - from: BND-09
    to: Filesystem
    protocol: file-handoff
    note: "Copies local sources and writes installed files."
  - from: BND-09
    to: git
    protocol: other
    note: "Shallow clone and ls-remote through the git binary. The only network surface."
  - from: BND-10
    to: Filesystem
    protocol: file-handoff
    note: "Reads and writes installed.yaml atomically."
