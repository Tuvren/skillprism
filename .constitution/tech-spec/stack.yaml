compatibility_policy:
  pinning: "Pin each direct dependency to a minor version in Cargo.toml and commit Cargo.lock. Pin the Rust toolchain to 1.85 in rust-toolchain.toml."
  lockfiles: [Cargo.lock]
  upgrade_boundaries: "A minor upgrade that does not change rendered output or CLI behavior may land with the lockfile. A major upgrade, or any upgrade that changes rendered output or CLI behavior, needs an ADR and updated tests."
