decisions:
  - id: OD-01
    question: "What should the yaml_str filter render for an undefined or none value, and for a sequence or map?"
    blocks: [SKP-L002, SKP-L003, src/engine/helpers.rs]
    options:
      - name: "null for undefined/none; error for sequences and maps"
        pros:
          - "Keeps today's semantics: an unset optional field (license, compatibility) stays YAML null, as with the bare `license: ` the scaffold renders now"
          - A list-typed field piped through the filter fails loudly instead of becoming a wrong-typed string
          - M2 can migrate every string field uniformly without wrapping each optional in an if
        cons:
          - "The filter no longer always yields a string; authors must know null is possible"
          - An error on sequences means templates must not pipe list fields through yaml_str
      - name: "always a string (empty for undefined, 'none' for none, display form for collections)"
        pros: ["Simplest contract: the output is always a quoted string"]
        cons:
          - "Unset optional fields become present empty strings (license: \"\"), a semantic change from today"
          - "A skill variable set to ~ becomes the text 'none'"
          - "Lists become their MiniJinja display string, a silent type change M3's check would not catch"
      - name: "always a string, and M2 wraps optional fields in {% if %} blocks"
        pros: [Keeps the string-only contract while preserving absence]
        cons:
          - "Every optional frontmatter line in scaffold, examples and docs needs template logic, which is noisier for authors"
          - Still silently stringifies collections
    recommendation: "null for undefined/none; error for sequences and maps"
    closure: ruling
    ruler: "the user (project owner), after the EPIC-L merge"
    interim:
      assumption: "yaml_str renders undefined and none as YAML null, renders strings/numbers/booleans as double-quoted strings, and raises an invalid-operation error naming yaml_str for sequences and maps; M2 applies the filter only to string-typed fields."
      applied_by: [src/engine/helpers.rs, SKP-L002]
    status: proposed
    asked:
      date: 2026-10-07
      in: EPIC-L
    proposed_by: EPIC-L @ 33b09d4
  - id: OD-02
    question: "Should the published JSON Schemas accept every value the loaders coerce or accept (plain scalars such as version: 1.0 for string fields, bare keys), or describe the recommended strict shape?"
    blocks:
      - SKP-M001
      - schemas/project-config-schema.json
      - schemas/harness-schema.json
    options:
      - name: "strict recommended shape; guarantee soundness (schema-valid always loads) and document where the schema is stricter"
        pros:
          - Editors steer authors toward quoted strings and canonical shapes
          - "The guarantee that matters most holds: a file the editor accepts never fails the CLI"
          - No loader behavior changes
        cons:
          - Editors flag some files the CLI accepts (false positives)
          - "JSON Schema cannot distinguish 1.0 from 1, so integral floats stay a documented soundness gap"
      - name: "mirror the loader exactly (accept numbers/booleans for string fields, null for bare keys)"
        pros: [No false positives in editors]
        cons:
          - Schemas become permissive and stop teaching the canonical shape
          - Still cannot express integral-float rejection
      - name: tighten the loader to match the strict schema
        pros: [Exact parity]
        cons:
          - Breaking change for existing configs that rely on coercion
          - Outside the scope of publishing schemas
    recommendation: "strict recommended shape; guarantee soundness (schema-valid always loads) and document where the schema is stricter"
    closure: ruling
    ruler: "the user (project owner), after the EPIC-M merge"
    interim:
      assumption: "Schemas describe the recommended strict shape; contract tests assert soundness through the real YAML loaders (every schema-valid sample loads) plus negative parity for closed objects; known stricter-than-loader cases and the integral-float gap are documented in the schema descriptions."
      applied_by:
        - schemas/project-config-schema.json
        - schemas/skill-schema.json
        - schemas/harness-schema.json
        - tests/schemas.rs
        - src/types/project.rs
        - src/registry/types.rs
        - src/loader/project.rs
    status: proposed
    asked:
      date: 2026-10-07
      in: EPIC-M
    proposed_by: EPIC-M @ 7d43400
