    item: "ADR-0007 should record that the shipped binary enables miette's fancy-no-backtrace reporter with a startup hook (plain ASCII when stderr is piped or NO_COLOR is set, no line wrapping), and that Diagnostic-bearing errors must be converted with miette::Report::new rather than into_diagnostic so help, labels and source code survive."
