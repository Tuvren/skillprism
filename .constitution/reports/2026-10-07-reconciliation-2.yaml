  - stage: tech-spec
    item: "code decision (pattern): One miette hook installed at startup in main.rs: plain ASCII without color, Unicode or hyperlinks when stderr is not a terminal or NO_COLOR is present and not \"0\" (matching supports-color); line wrapping disabled in both modes so help URLs stay intact. [src/main.rs] at e29c6a3"
    from: K
  - stage: tech-spec
    item: "code decision (convention): Diagnostic-bearing errors are converted with map_err(miette::Report::new) in the CLI; into_diagnostic is reserved for plain std errors, because it drops help, labels and source code. [src/cli.rs] at 46e0449"
    from: K
  - stage: tech-spec
    item: "code decision (contract_shape): ProjectError::YamlParse replaced by YamlSyntax and ConfigSchema, each with the reason in the headline, real parser location when available (used only when it refers to the offending field), a 'here' source label sized to the token including quoted scalars, and help text; ConfigSchema carries a ConfigKind (project, skill, harness) that selects the matching docs URL in help; missing-field errors are always file-level; scalar and map-key type errors name the field path (map keys called out as keys), recovered by diagnostic-only probes on the existing structs while from_value stays authoritative. Shared classification lives in src/loader/yaml.rs. [src/types/error.rs, src/loader/yaml.rs, src/loader/project.rs, src/registry/mod.rs] at 471869f"
    from: K
