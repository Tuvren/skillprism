    item: "code decision (dependency): Enable miette's fancy-no-backtrace feature (miette stays 7.6.0); adds owo-colors 4.2.3, supports-color 3.0.2, supports-hyperlinks 3.2.0, supports-unicode 3.0.0, terminal_size 0.4.4, textwrap 0.16.2, unicode-linebreak 0.1.5, is_ci 1.2.0 (MSRV verified with cargo +1.85 build --release --locked). [Cargo.toml, Cargo.lock] at 46e0449"
