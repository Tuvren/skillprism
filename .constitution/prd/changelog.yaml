  - version: v0.2.0
    date: 2026-07-02
    changed: ["Reopened `out-of-scope/plugin-marketplace.md` by operator directive (Epic I activation)", "The distribution CLI capabilities (`add` / `list` / `remove` / `update` for skill sources) are now in scope; the marketplace-specific facets (storefronts, publishing, discovery) remain deferred", "`out-of-scope/plugin-marketplace.md` carries a `[REOPENED 2026-07-02]` banner explaining the partial-reopen status", "Full PRD revision (capability additions, glossary updates, fresh out-of-scope re-categorization) is a downstream follow-up; this entry is the canonical record of the operator's directive until that revision lands", "**Amended `constraints.md` Binary Distribution section** to allow the `git` binary as a documented runtime dependency for the `add` and `update` distribution commands only", "The amendment is a focused exception: the `build`, `validate`, `init`, and `completions` commands remain purely static-binary with no runtime dependencies", "Rationale: spike DIST-I001 (`.constitution/spikes/SPK-DIST-I001.md`) recommended shelling out to `git` directly, matching Vercel's two-year production track record and avoiding a native HTTP client. The amendment is the smallest change that unblocks the network layer. (Binary-size impact not benchmarked; the qualitative point is no native TLS stack to ship — the same caveat is in ADR-008.)", "`git` is assumed to be present on the user's PATH. If it is missing, the OS-level `ENOENT` from `Command::status` surfaces as a normal runtime error (no dedicated startup gate is implemented)"]
