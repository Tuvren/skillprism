baseURL = "https://tuvren.github.io/skillprism/"
locale = "en-us"
title = "skillprism"
description = "Distribution CLI with per-harness templating for agent skills."
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

# Keep the default static mount when adding the schema file mounts.
[[module.mounts]]
source = "static"
target = "static"

# Schema URLs are versioned by the config format (skillprism: '1').
[[module.mounts]]
source = "../schemas/project-config-schema.json"
target = "static/schema/v1/skillprism.json"

[[module.mounts]]
source = "../schemas/skill-schema.json"
target = "static/schema/v1/skill.json"

[[module.mounts]]
source = "../schemas/harness-schema.json"
target = "static/schema/v1/harness.json"

[[menus.main]]
name = "Docs"
pageRef = "/docs/quickstart"
identifier = "docs"
weight = 10

[[menus.main]]
name = "GitHub"
url = "https://github.com/tuvren/skillprism"
weight = 20
[menus.main.params]
external = true


[markup.highlight]
style = "github-dark"
lineNos = false
codeFences = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[markup.goldmark.renderer]
unsafe = true

[caches.images]
dir = ":cacheDir/images"

[params]
description = "Distribution CLI with per-harness templating for agent skills."
github = "https://github.com/tuvren/skillprism"
spec = "https://agentskills.io/specification"
version = "0.3.0"
